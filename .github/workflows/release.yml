name: Release

# 打 v* 标签时自动创建 GitHub Release：先完整跑一遍检查，通过后生成发布说明
# 镜像的语义化版本标签由 docker.yml 负责推送
on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 版本由 package.json 的 packageManager 字段决定
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: 校验标签与 package.json 版本一致
        run: test "${GITHUB_REF_NAME}" = "v$(node -p "require('./package.json').version")"

      - name: 校验三处版本号一致（package.json / web / src/version.ts）
        run: node scripts/check-version.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  release:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 创建 GitHub Release
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG 已存在，跳过创建"
            exit 0
          fi
          FLAGS=(--generate-notes)
          # 预发布版本（带 - 的语义化版本）标记为 prerelease
          if [[ "$TAG" == *-* ]]; then
            FLAGS+=(--prerelease)
          fi
          gh release create "$TAG" "${FLAGS[@]}"
        env:
          GH_TOKEN: ${{ github.token }}
