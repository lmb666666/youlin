name: Release

# 打 v* 标签时自动创建 GitHub Release：先完整跑一遍检查，通过后生成发布说明
# 镜像的语义化版本标签由 docker.yml 负责推送
on:
  push:
    tags: ['v*']

# 顶层只给读权限；创建 Release 的写权限在 release job 内声明
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # 版本由 package.json 的 packageManager 字段决定
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: 校验标签与 package.json 版本一致
        run: test "${GITHUB_REF_NAME}" = "v$(node -p "require('./package.json').version")"

      - name: 校验四处版本号一致（package.json / web / contracts / src/version.ts）
        run: node scripts/check-version.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  release:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: 等待同标签镜像发布
        # arm64 原生构建最长 30 分钟，等待窗口要覆盖整个镜像发布链路
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for i in $(seq 1 60); do
            if docker buildx imagetools inspect "ghcr.io/${{ github.repository }}:${tag}" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 30
          done
          echo "镜像 ghcr.io/${{ github.repository }}:${tag} 未在 30 分钟内发布" >&2
          exit 1

      - name: 创建 GitHub Release
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG 已存在，跳过创建"
            exit 0
          fi
          FLAGS=(--generate-notes)
          # 预发布版本（带 - 的语义化版本）标记为 prerelease
          if [[ "$TAG" == *-* ]]; then
            FLAGS+=(--prerelease)
          fi
          gh release create "$TAG" "${FLAGS[@]}"
        env:
          GH_TOKEN: ${{ github.token }}
