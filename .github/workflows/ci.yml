name: CI

on:
  push:
    branches: [main]
  pull_request:

# 只读 checkout，不需要任何写权限
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # pin 到 commit SHA（防 tag 被上游移动），版本注释仅供阅读
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # 版本由 package.json 的 packageManager 字段决定
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Version consistency
        run: node scripts/check-version.mjs

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: |
          pnpm build
          pnpm build:server

      - name: Audit (production)
        run: pnpm audit --prod --audit-level=high

      - name: Config docs drift
        run: |
          pnpm docs:config
          git diff --exit-code docs/configuration.md

  docker:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # buildx + gha 缓存：依赖层命中后烟测构建只需数十秒
      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: youlin-ci
          cache-from: type=gha,scope=ci-image
          cache-to: type=gha,scope=ci-image,mode=max

      - name: Smoke test container
        run: |
          set -eu
          docker volume create youlin-ci-data
          docker run -d --name youlin-ci \
            --read-only --tmpfs /tmp:size=64m \
            --cap-drop ALL --security-opt no-new-privileges \
            -p 127.0.0.1:18787:8787 \
            -v youlin-ci-data:/data \
            -e ADMIN_TOKEN=ci-admin-token -e CRON_ENABLED=false \
            youlin-ci
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:18787/healthz >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18787/healthz | grep -q '"ok":true'
          curl -fsS -H 'Content-Type: application/json' \
            -d '{"token":"ci-admin-token"}' \
            http://127.0.0.1:18787/api/admin/login | grep -q '"ok":true'

      - name: Container logs on failure
        if: failure()
        run: docker logs youlin-ci || true

      - name: Cleanup
        if: always()
        run: |
          docker rm -f youlin-ci || true
          docker volume rm youlin-ci-data || true
