packages:
  - "."
  - "web"
  - "packages/*"

# 允许执行构建脚本的依赖（pnpm 11 语法；其余默认拒绝）
allowBuilds:
  better-sqlite3: true
  esbuild: true

# 传递依赖安全修复：ESLint 的 minimatch 10.x 有 ReDoS 公告（>=11.0.1 修复）
overrides:
  minimatch: ^11.0.1

peerDependencyRules:
  allowedVersions:
    '@hookform/resolvers>ajv-formats': '3'
