# 友邻 Youlin · Docker Compose
#
#   1. cp .env.example .env 并填写 ADMIN_TOKEN
#   2. docker compose up -d
#   3. 浏览器打开 http://127.0.0.1:8787/admin/login
#
# 端口默认只绑回环：对外访问交给反代（Caddy/Nginx，见 docs/deployment.md），
# 由它提供 HTTPS 并把流量转给 127.0.0.1:8787。需要不经反代直连时，
# 把 ports 改成 "8787:8787"（明文 HTTP，不推荐长期使用）。

services:
  youlin:
    image: ghcr.io/lmb666666/youlin:latest
    # 想本地构建时改成：
    # build: .
    container_name: youlin
    restart: unless-stopped
    # 容器加固：非 root 运行（镜像内 USER node）、只读根文件系统、无特权
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 100
    stop_grace_period: 15s
    ports:
      - "127.0.0.1:8787:8787"
    env_file:
      - .env
    environment:
      # 数据卷固定挂到 /data，SQLite（含 WAL）都在这里
      TZ: Asia/Shanghai
    volumes:
      - youlin-data:/data
    # 镜像内置 healthcheck（GET /healthz），无需重复声明
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  youlin-data:
